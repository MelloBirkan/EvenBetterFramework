name: Corpus

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check corpus index
        run: python3 scripts/build_corpus_index.py --check --validate-skill-refs

      - name: Validate JSON files
        run: |
          jq . \
            plugins/evenbetter-ios/corpus/index.json \
            .claude-plugin/marketplace.json \
            .agents/plugins/marketplace.json \
            plugins/evenbetter-ios/.claude-plugin/plugin.json \
            plugins/evenbetter-ios/.codex-plugin/plugin.json

      - name: Validate skill names
        run: |
          failed=0
          for skill in skills/* plugins/evenbetter-ios/skills/*; do
            [ -d "$skill" ] || continue
            name="$(basename "$skill")"
            if ! rg -n "^name: $name$" "$skill/SKILL.md" >/dev/null; then
              echo "name mismatch: $skill"
              failed=1
            fi
          done
          exit "$failed"

      - name: Check whitespace
        run: git diff --check
