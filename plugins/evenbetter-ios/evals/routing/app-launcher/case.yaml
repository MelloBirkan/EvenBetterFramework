schema_version: "1.1"
name: routing-app-launcher
description: 'Pricing and App Review questions for a finished app load evenbetter-app-launcher.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'My iOS app is nearly finished. What should I charge for it, and what do I need ready for App Review and the store listing?'
graders:
  - name: loads-evenbetter-app-launcher
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-app-launcher"'
