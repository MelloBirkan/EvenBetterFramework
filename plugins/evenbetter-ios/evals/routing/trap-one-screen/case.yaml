schema_version: "1.1"
name: routing-trap-one-screen
description: 'Trap: reworking one screen goes to evenbetter-ios-feature, not evenbetter-ios-epic.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'Rework just the plant detail screen in my SwiftUI app so it shows the next watering date and a big water button. Let''s plan it together first.'
graders:
  - name: loads-evenbetter-ios-feature
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-ios-feature"'
  - name: skips-evenbetter-ios-epic
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-ios-epic"'
    min: 0
    max: 0
