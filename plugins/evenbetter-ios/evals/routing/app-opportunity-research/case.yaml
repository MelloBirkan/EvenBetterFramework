schema_version: "1.1"
name: routing-app-opportunity-research
description: 'Looking for an App Store gap with competitor research loads evenbetter-app-opportunity-research.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'I want to build an iPhone app but I don''t know what yet. Can you find gaps in the App Store''s habit-tracking category, with real competitors and what their users complain about?'
graders:
  - name: loads-evenbetter-app-opportunity-research
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-app-opportunity-research"'
