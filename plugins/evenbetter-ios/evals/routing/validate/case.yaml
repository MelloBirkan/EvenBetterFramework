schema_version: "1.1"
name: routing-validate
description: 'A request to double-check an existing audit report loads evenbetter-validate.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'Last week you audited this app and left an HTML report in .evenbetter/plant-care. Before I touch any code, can you double-check those findings against the current source and throw out the false positives?'
graders:
  - name: loads-evenbetter-validate
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-validate"'
