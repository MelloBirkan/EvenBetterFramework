schema_version: "1.1"
name: routing-trap-repo-audit
description: 'Trap: checking a whole project''s accessibility goes to evenbetter-analyze, not evenbetter-swiftui-accessibility.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'Check the accessibility of my whole iOS project, every screen: VoiceOver labels, Dynamic Type, contrast, hit targets. I want one report I can work through.'
graders:
  - name: loads-evenbetter-analyze
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-analyze"'
  - name: skips-evenbetter-swiftui-accessibility
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-swiftui-accessibility"'
    min: 0
    max: 0
