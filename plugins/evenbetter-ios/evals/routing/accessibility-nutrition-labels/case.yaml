schema_version: "1.1"
name: routing-accessibility-nutrition-labels
description: 'Choosing what to declare in App Store Connect''s App Accessibility section loads evenbetter-accessibility-nutrition-labels.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'App Store Connect now has an App Accessibility section for my app. Which of those accessibility features can I honestly say my iPhone app supports?'
graders:
  - name: loads-evenbetter-accessibility-nutrition-labels
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-accessibility-nutrition-labels"'
