schema_version: "1.1"
name: routing-accessibility-tests
description: 'Checking accessibility in the running app with kept UI tests loads evenbetter-accessibility-tests.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'I''d like to see whether the accessibility problems in my iOS app actually show up when it runs in the simulator, and keep those checks around as UI tests.'
graders:
  - name: loads-evenbetter-accessibility-tests
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-accessibility-tests"'
