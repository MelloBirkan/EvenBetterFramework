schema_version: "1.1"
name: routing-ios-epic
description: 'Planning a new iPhone app across several screens loads evenbetter-ios-epic.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'I''m starting a houseplant app for iPhone from scratch: onboarding, a plant list, plant details, watering reminders and settings. Help me plan the screens and how people move between them.'
graders:
  - name: loads-evenbetter-ios-epic
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-ios-epic"'
