schema_version: "1.1"
name: routing-repair
description: 'A request to fix the findings of a validated report loads evenbetter-repair.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'The audit report for this app has been checked and it''s validated now. Go ahead and fix the criticals it lists in the Swift code.'
graders:
  - name: loads-evenbetter-repair
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-repair"'
