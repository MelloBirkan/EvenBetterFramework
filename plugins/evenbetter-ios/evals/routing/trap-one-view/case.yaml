schema_version: "1.1"
name: routing-trap-one-view
description: 'Trap: reviewing one view''s accessibility goes to evenbetter-swiftui-accessibility, not evenbetter-analyze.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'Can you review the accessibility of PlantRow.swift? Just this one view: its VoiceOver label, the grouping and the hit target.'
graders:
  - name: loads-evenbetter-swiftui-accessibility
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-swiftui-accessibility"'
  - name: skips-evenbetter-analyze
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-analyze"'
    min: 0
    max: 0
