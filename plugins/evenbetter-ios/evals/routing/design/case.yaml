schema_version: "1.1"
name: routing-design
description: 'Giving a SwiftUI screen a visual identity loads evenbetter-design.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'My SwiftUI app looks like every template out there. Give the home screen a real personality: colours, type, the overall feel.'
graders:
  - name: loads-evenbetter-design
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-design"'
