schema_version: "1.1"
name: routing-ios-debugger-agent
description: 'Running the app in the simulator to chase a crash loads evenbetter-ios-debugger-agent.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'Build my iOS app, launch it in the simulator and tap through onboarding. It crashes on the third page and I need the console output to see why.'
graders:
  - name: loads-evenbetter-ios-debugger-agent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-ios-debugger-agent"'
