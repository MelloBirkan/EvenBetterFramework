schema_version: "1.1"
name: behaviour-ios-feature
description: Planning a favourites screen on PlantCare starts with closed questions and writes no code.
expected_outcome: evenbetter-ios-feature loads, reads the app, and ends its turn on one to three closed questions, each with concrete options and one marked recommended, or takes the recommended options, lists them as assumptions and ends with what waits on the user. No Swift file is written or edited.
tags: [behaviour]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: setup.sh
graders:
  - name: loads-evenbetter-ios-feature
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-ios-feature"'
  - name: marks-a-recommended-option
    type: regex
    pattern: 'recommend'
    flags: i
  - name: no-swift-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*\.swift"'
    min: 0
    max: 0
  - name: no-swift-write
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*\.swift"'
    min: 0
    max: 0
