schema_version: "1.1"
name: behaviour-accessibility-tests-no-xcode
description: On a machine with no xcodebuild or simulator, evenbetter-accessibility-tests plans the run, says it needs a Mac with Xcode, and offers the write-only path without touching app code.
expected_outcome: The skill loads the validated report, finds no Xcode, and either asks before writing or writes only test files and .evenbetter/ artifacts. App sources are unchanged and every runtime verdict stays untested. The reply names the Mac and Xcode requirement and the commands or next step for a write-only run.
tags: [behaviour]
runs: 3
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: setup.sh
graders:
  - name: loads-evenbetter-accessibility-tests
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-ios:)?evenbetter-accessibility-tests"'
  - name: no-runtime-verdicts
    type: regex
    target: {source: file, path: .evenbetter/plant-care/evenbetter-analyze-report.html}
    pattern: '"status"\s*:\s*"(?:confirmed|refuted|inconclusive|not_testable)"'
    match: not_contains
  - name: app-entry-unchanged
    type: regex
    target: {source: file, path: PlantCare/PlantCareApp.swift}
    pattern: 'WindowGroup \{\n\s*PlantListView\(\)\n\s*\.environment\(store\)'
  - name: no-edit-to-app-source
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*UITests)[^"]*/PlantCare/'
    min: 0
    max: 0
  - name: no-write-to-app-source
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*UITests)[^"]*/PlantCare/'
    min: 0
    max: 0
  - name: detail-view-unchanged
    type: regex
    target: {source: file, path: PlantCare/Views/PlantDetailView.swift}
    pattern: 'Image\(systemName: "trash"\)\n\s*\.frame\(width: 28, height: 28\)\n\s*\.onTapGesture'
  - name: list-view-unchanged
    type: regex
    target: {source: file, path: PlantCare/Views/PlantListView.swift}
    pattern: 'label: \{\n\s*Image\(systemName: "plus"\)\n\s*\}[\s\S]*\.font\(\.system\(size: 9\)\)\n\s*\.foregroundColor\(\.black\)'
