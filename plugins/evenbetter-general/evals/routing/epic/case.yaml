schema_version: "1.1"
name: routing-epic
description: 'Planning a new multi-flow product area loads evenbetter-general-epic.'
tags: [routing]
runs: 3
execution:
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
  append_system_prompt: 'This session is a routing check for the installed skills. Choose the one skill that best fits the user''s request and load it with the Skill tool. Once it has loaded, stop: do not follow its instructions, open files, run commands or ask questions. Reply with one line that names the skill you loaded.'
  prompt: 'We''re adding a whole marketplace to our SaaS: sellers list products, buyers check out, and admins moderate listings and payouts. Plan it end to end before anyone writes code.'
graders:
  - name: loads-evenbetter-general-epic
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evenbetter-general:)?evenbetter-general-epic"'
